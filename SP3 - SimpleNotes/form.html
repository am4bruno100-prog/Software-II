{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 p-4 rounded-3">
            <h3 class="fw-bold mb-4 text-dark">{% if nota %}Editar nota{% else %}Nova nota{% endif %}</h3>
            <form method="POST">
                <div class="mb-3">
                    <label for="titulo" class="form-label fw-semibold">Título</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" value="{{ nota.titulo if nota else '' }}" required placeholder="Ex: Estudar SQL">
                </div>
                <div class="mb-3">
                    <label for="categoria_id" class="form-label fw-semibold">Categoria</label>
                    <select class="form-select" id="categoria_id" name="categoria_id" required>
                        {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if nota and nota.categoria_id == cat.id %}selected{% endif %}>{{ cat.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label for="conteudo" class="form-label fw-semibold">Conteúdo</label>
                    <textarea class="form-control" id="conteudo" name="conteudo" rows="5" required placeholder="Escreva o conteúdo da sua nota...">{{ nota.conteudo if nota else '' }}</textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold px-4">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
