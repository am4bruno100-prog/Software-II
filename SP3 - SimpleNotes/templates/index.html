{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-secondary">Notas</h2>
</div>
<div class="row g-4">
    {% for nota in notas %}
    <div class="col-md-6 col-lg-4">
        <div class="card card-note h-100 p-3">
            <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title fw-bold text-dark mb-0">{{ nota.titulo }}</h5>
                    <span class="badge bg-primary rounded-pill">{{ nota.categoria_nome }}</span>
                </div>
                <p class="card-text text-muted flex-grow-1 mt-2">{{ nota.conteudo }}</p>
                <div class="d-flex justify-content-end gap-2 mt-3 pt-2 border-top">
                    <a href="{{ url_for('editar', id=nota.id) }}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil me-1"></i>Editar</a>
                    <form action="{{ url_for('excluir', id=nota.id) }}" method="POST" onsubmit="return confirm('Deseja excluir esta nota?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12 text-center py-5">
        <i class="bi bi-inbox fs-1 text-muted"></i>
        <p class="text-muted mt-2">Nenhuma nota encontrada nesta categoria.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
