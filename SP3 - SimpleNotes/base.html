<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleNotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .sidebar { background-color: #1e293b; min-height: 100vh; color: #fff; }
        .sidebar .nav-link { color: #cbd5e1; border-radius: 6px; margin-bottom: 4px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #334155; color: #fff; }
        .card-note { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card-note:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 sidebar p-3">
                <h3 class="fw-bold mb-4 text-warning"><i class="bi bi-journal-text me-2"></i>SimpleNotes</h3>
                <a href="{{ url_for('criar') }}" class="btn btn-warning w-100 fw-bold mb-4 py-2"><i class="bi bi-plus-lg me-1"></i> Criar nota</a>
                <h6 class="text-uppercase text-muted fs-7 fw-bold mb-2">Categorias</h6>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link {% if not categoria_selecionada %}active{% endif %}" href="{{ url_for('index') }}"><i class="bi bi-grid me-2"></i>Todas as notas</a>
                    </li>
                    {% for cat in categorias %}
                    <li class="nav-item">
                        <a class="nav-link {% if categoria_selecionada == cat.id %}active{% endif %}" href="{{ url_for('index', categoria_id=cat.id) }}"><i class="bi bi-folder me-2"></i>{{ cat.nome }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </nav>
            <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
